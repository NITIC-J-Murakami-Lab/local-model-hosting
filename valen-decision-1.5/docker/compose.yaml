# Valen-Team/Valen-Decision-1.5-27B (decisions at /v1/decisions and /v1/systemone). Engine: SGLang v0.5.23 + the official Valen plugin
# The image is built from the official Dockerfile in the submodule (../Valen).
# The entrypoint comes from that Dockerfile and hardcodes `--attention-backend fa3`.
# FA3 has kernels for SM80 (A100) and SGLang v0.5.23 does not reject SM80, but it has not been confirmed to run on A100.
# The plugin supports a single GPU only (TP=PP=1).
# Without --dtype bfloat16 the model loads in FP32 and uses twice the memory (per the plugin README).

services:
  fetch-valen:
    extends:
      file: ../../docker/common.yaml
      service: fetch
    profiles: [valen]
    # assets/ holds images for the README, so skip it
    command: [Valen-Decision-1.5-27B, Valen-Team/Valen-Decision-1.5-27B, 9f1b90bcb6841d9a4a44acfd84c6ecbd4c18fec6, --exclude=assets/*]

  valen:
    extends:
      file: ../../docker/common.yaml
      service: server
    profiles: [valen]
    image: local-model-hosting/valen-sglang:f6df4fd
    build:
      context: ../Valen
      dockerfile: serving/sglang/docker/Dockerfile
    depends_on:
      fetch-valen:
        condition: service_completed_successfully
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:${VALEN_PORT:-8002}:8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VALEN_GPU:-2}"]
              capabilities: [gpu]
    volumes:
      - valen-cache:/root/.cache
    command: >-
      --model-path /models/Valen-Decision-1.5-27B
      --served-model-name Valen-Team/Valen-Decision-1.5-27B
      --port 8000
      --dtype bfloat16

volumes:
  valen-cache:
