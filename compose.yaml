# Entry point: one slot per GPU. GPUn_MODEL in .env picks the model that slot gpuN runs on GPU n (the index nvidia-smi
# shows); a blank value leaves the GPU free. The same model may run in several slots. The choices are listed in models.yaml.
#   docker compose up -d           apply .env: fetch missing weights, start changed slots, stop emptied ones
#   docker compose up -d gpu2      start or update just this slot
#   docker compose logs -f gpu2    follow one slot's log
#   docker compose down            stop every slot
#
#   slot  GPU  port (.env)
#   gpu0  0    GPU0_PORT (8000)
#   gpu1  1    GPU1_PORT (8001)
#   gpu2  2    GPU2_PORT (8002)
#   gpu3  3    GPU3_PORT (8003)
#
# Each slot pairs fetch-gpuN, which fetches the weights of its model, with gpuN, the server, which starts once they are ready.

services:
  fetch-gpu0:
    extends: {file: models.yaml, service: "fetch-${GPU0_MODEL:-none}"}
  gpu0:
    extends: {file: models.yaml, service: "${GPU0_MODEL:-none}"}
    depends_on: {fetch-gpu0: {condition: service_completed_successfully}}
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${GPU0_PORT:-8000}:8000"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["0"], capabilities: [gpu]}]}}}

  fetch-gpu1:
    extends: {file: models.yaml, service: "fetch-${GPU1_MODEL:-none}"}
  gpu1:
    extends: {file: models.yaml, service: "${GPU1_MODEL:-none}"}
    depends_on: {fetch-gpu1: {condition: service_completed_successfully}}
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${GPU1_PORT:-8001}:8000"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["1"], capabilities: [gpu]}]}}}

  fetch-gpu2:
    extends: {file: models.yaml, service: "fetch-${GPU2_MODEL:-none}"}
  gpu2:
    extends: {file: models.yaml, service: "${GPU2_MODEL:-none}"}
    depends_on: {fetch-gpu2: {condition: service_completed_successfully}}
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${GPU2_PORT:-8002}:8000"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["2"], capabilities: [gpu]}]}}}

  fetch-gpu3:
    extends: {file: models.yaml, service: "fetch-${GPU3_MODEL:-none}"}
  gpu3:
    extends: {file: models.yaml, service: "${GPU3_MODEL:-none}"}
    depends_on: {fetch-gpu3: {condition: service_completed_successfully}}
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${GPU3_PORT:-8003}:8000"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["3"], capabilities: [gpu]}]}}}

# Engine caches (JIT kernels, torch.compile, etc.), one per model and shared by every slot that runs it.
# Extended files do not bring their top-level volumes along, so they are declared here.
volumes:
  qwen-cache:
  jev-cache:
  valen-cache:
  pplx-cache:
  d3-cache:
  glimmer-cache:
  gemma-cache:
